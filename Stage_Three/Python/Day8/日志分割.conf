/var/log/redis/redis.log {
    # 每天分割一次日志，也可按日志大小分割（如size 100M）
    daily
    # 保留最近30天的归档日志，超过的自动删除
    rotate 30
    # 对分割后的旧日志文件进行gzip压缩，节省磁盘空间
    compress
    # 分割后创建新的空日志文件，权限设为644，属主设为redis用户
    create 644 redis redis
    # 分割日志后，向Redis服务发送USR1信号，重新打开日志文件，避免写入旧文件
    postrotate
        /bin/kill -USR1 $(cat /var/run/redis_6379.pid) > /dev/null 2>&1
    endscript
}