# 1. 日志级别：生产级建议配置为notice，平衡信息量与性能；开发级可设为debug，完整记录执行细节
# 级别划分（优先级从低到高）：debug → verbose → notice → warning
# debug：记录所有命令、持久化、复制细节，生产环境会产生大量日志，影响磁盘IO；
# verbose：记录大部分运行细节，如连接建立、命令执行、RDB/AOF启动；
# notice：记录关键运行事件，如服务启动、持久化完成、主从切换、慢查询记录；
# warning：仅记录错误、异常、告警事件，如内存不足、持久化失败、连接超时；
loglevel notice

# 2. 日志输出模式：生产环境必须记录到本地文件，同时建议配置syslog，支持分布式日志采集
# 配置为"stdout"则输出到控制台，守护进程模式下会被丢弃；配置为"/var/log/redis/redis.log"则写入指定文件
logfile "/var/log/redis/redis.log"

# 3. 系统日志（syslog）配置：将日志同时发送到本地syslog服务，支持带标签过滤，集群环境下必须开启
# 启用syslog日志机制
syslog-enabled yes
# 设置syslog的日志标签，区分不同集群节点，格式为：redis-<端口号>，便于多节点日志归集
syslog-ident redis-6379
# syslog的日志设备标识，默认设为local0，对应Linux syslog的配置规则
syslog-facility local0

# 4. 集群专属日志配置：仅在Redis Cluster模式下生效，记录分片迁移、故障转移、节点握手细节
# 集群工作目录配置，用于保存集群节点的运行状态日志、节点配置文件
cluster-working-directory /var/lib/redis-cluster/
# 集群节点超时时间，单位毫秒，超时后记录日志并启动故障转移
cluster-node-timeout 15000