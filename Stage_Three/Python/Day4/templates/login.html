<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
</head>
<body>
    <div>
        <h2>系统登录</h2>
        <!-- action 可以省略，默认提交到当前路由，但写上更清晰 -->
        <form action="{{ url_for('login') }}" method="POST">
            <input name="username" placeholder="请输入用户名" required>
            <input name="password" placeholder="请输入密码" required>
            <button>登 录</button>
        </form>
    </div>
</body>
</html>
