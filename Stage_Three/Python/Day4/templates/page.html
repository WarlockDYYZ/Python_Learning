{% extends "base.html" %}

<!-- 重写title块 -->
{% block title %}页面标题 - Flask应用{% endblock %}

<!-- 重写content块，注入页面的特有内容 -->
{% block content %}
    <h1>页面内容</h1>
    <p>这是页面的具体内容，它继承了base.html的公共结构。</p>
    <div class="content">
        {% for item in items %}

        {% endfor %}
    </div>
{% endblock %}

<!-- 重写scripts块，引入当前页面特有的JS文件 -->
{% block scripts %}

{% endblock %}
