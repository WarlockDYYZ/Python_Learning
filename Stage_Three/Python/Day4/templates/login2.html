<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
</head>
<body>
    <h1>用户登录</h1>
    <!-- 如果存在错误信息，显示红色的错误提示 -->
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <!-- 表单提交到当前路由，method指定为POST -->
    <form method="post">
        <div>
            <label>用户名：</label>
            <input type="text" name="username" required>
        </div>
        <div>
            <label>密码：</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">登录</button>
    </form>
</body>
</html>
