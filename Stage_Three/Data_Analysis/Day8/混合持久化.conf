# 1. 开启混合持久化，AOF重写时，先将内存数据以RDB格式写入AOF文件开头，再追加增量命令
aof-use-rdb-preamble yes

# 2. AOF持久化总开关，生产级必须开启，记录所有写命令的增量日志
appendonly yes
# AOF文件名称，默认appendonly.aof
appendfilename "appendonly.aof"
# AOF刷盘策略，生产级建议设置为everysec，理论上最多丢失1秒内的写命令，兼顾性能与可靠性
appendfsync everysec

# 3. RDB快照触发规则，生产级建议设置为：每5分钟内有至少1个键被修改时生成快照
save 300 1
save 60 1000
save 10 10000
# 后台保存RDB快照时，是否停止处理新的写命令；生产级设置为no，不阻塞业务请求
stop-writes-on-bgsave-error no
# 开启RDB文件压缩，采用LZF算法压缩，节省磁盘空间；生产级建议开启
rdbcompression yes
# 对RDB文件的末尾进行校验和验证，避免快照文件损坏；生产级建议开启
rdbchecksum yes
# RDB文件名称，默认dump.rdb
dbfilename "dump.rdb"

# 4. 持久化日志与运行时日志联动配置：AOF重写、RDB快照执行完成后，将结果写入系统日志
# 启用持久化事件通知，将RDB/AOF的执行状态变化发布到指定的频道
notify-keyspace-events Es$